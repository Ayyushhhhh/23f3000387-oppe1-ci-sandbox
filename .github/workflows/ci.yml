name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/262111686106/locations/global/workloadIdentityPools/oppe1-ci-pool/providers/oppe1-ci-provider
          service_account: oppe1-ci-runner@project-1f67ea53-6e26-4103-9ed.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull test data from DVC
        run: dvc pull data/test.csv.dvc

      - name: Run predictions and generate metrics
        env:
          MLFLOW_TRACKING_URI: http://34.93.84.95:5000
          MODEL_NAME: stock_movement_predictor
          MODEL_ALIAS: champion
        run: python ci/predict_and_report.py

      - name: Run per-feature sanity tests
        run: pytest ci/test_sanity.py -v

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Post CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## CI Evaluation Report" > report.md
          echo "" >> report.md
          echo '```json' >> report.md
          cat ci_out/metrics.json >> report.md
          echo '```' >> report.md
          echo "" >> report.md
          echo "![metrics](./ci_out/metrics.png)" >> report.md
          cml comment create report.md
